# ROG Power Manager: Unprivileged permissions on boot (systemd-tmpfiles)
z /sys/class/backlight/*/brightness 0666 root root - -
z /sys/class/leds/*kbd_backlight*/brightness 0666 root root - -
z /sys/class/power_supply/*/charge_control_end_threshold 0666 root root - -
z /sys/devices/platform/asus-nb-wmi/panel_od 0666 root root - -
z /sys/devices/platform/asus-nb-wmi/gpu_mux_mode 0666 root root - -
z /sys/devices/platform/asus-nb-wmi/throttle_thermal_policy 0666 root root - -
z /sys/devices/platform/asus-nb-wmi/hwmon/hwmon*/* 0666 root root - -
z /sys/firmware/acpi/platform_profile 0666 root root - -
z /sys/devices/system/cpu/cpufreq/boost 0666 root root - -
z /sys/bus/pci/devices/*/power/control 0666 root root - -
